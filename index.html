<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knauf AI Kalkulator</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            min-height: 100vh; margin: 0; padding: 15px; 
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
        }
        .box, .login-box { 
            background: white; padding: 25px; border-radius: 12px; 
            width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box;
        }
        .box { max-width: 500px; display: none; }
        .login-box { max-width: 360px; text-align: center; }
        h2, h3 { color: #0f172a; text-align: center; margin: 0 0 15px 0; }
        .vnos { margin-bottom: 12px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; font-size: 14px; }
        input, select { 
            width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #cbd5e1; 
            border-radius: 6px; font-size: 16px; background: #fff;
        }
        button { 
            width: 100%; padding: 14px; background: #0284c7; color: white; border: none; 
            font-weight: bold; cursor: pointer; font-size: 16px; border-radius: 6px; margin-top: 5px;
        }
        button.btn-login { background: #e30613; }
        button.btn-odjava { width: auto; padding: 6px 12px; background: #64748b; font-size: 13px; margin: 0; }
        .rezultati { margin-top: 20px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; font-size: 14px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; }
        .error-msg { color: #e30613; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<!-- 1. PRIJAVA -->
<div class="login-box" id="oknoPrijava">
    <h3>🔐 Zaklenjen sistem</h3>
    <div class="vnos">
        <label>Uporabniško ime:</label>
        <input type="text" id="user">
    </div>
    <div class="vnos">
        <label>Geslo:</label>
        <input type="password" id="pass">
    </div>
    <button class="btn-login" onclick="klikPrijava()">PRIJAVA</button>
    <div class="error-msg" id="napakica">Napačni podatki!</div>
</div>

<!-- 2. KALKULATOR -->
<div class="box" id="oknoKalkulator">
    <div style="text-align: right; margin-bottom: 10px;">
        <button class="btn-odjava" onclick="klikOdjava()">➡️ Odjava</button>
    </div>
    <h2>Knauf AI Kalkulator</h2>
    <div class="vnos">
        <label>Kaj gradite?</label>
        <select id="gradnja">
            <option value="1">🧱 Predelna stena (Sistem 50mm)</option>
            <option value="2" selected>🧱 Predelna stena (Sistem 75mm)</option>
            <option value="3">🧱 Predelna stena (Sistem 100mm)</option>
            <option value="4">🏠 Raven strop (Spust do 12 cm)</option>
            <option value="5">🏠 Raven strop (Spust nad 12 cm)</option>
            <option value="6">📐 Mansarda poševnina (Direktna)</option>
            <option value="7">📐 Mansarda poševnina (Šponarji)</option>
        </select>
    </div>
    <div class="vnos">
        <label>Obloga plošč:</label>
        <select id="obloga">
            <option value="1" selected>Enojna obloga (1 plast)</option>
            <option value="2">Dvojna obloga (2 plasti)</option>
        </select>
    </div>
    <div class="vnos">
        <label>Dolžina (metri):</label>
        <input type="number" id="dolz" value="4.5" step="0.1">
    </div>
    <div class="vnos">
        <label>Višina / Širina (metri):</label>
        <input type="number" id="vis" value="2.5" step="0.1">
    </div>
    <div class="vnos">
        <label>Tip plošče:</label>
        <select id="tip">
            <option value="siva">Siva plošča (GKB - Navadna)</option>
            <option value="zelena">Zelena plošča (GKBI - Vlaga)</option>
            <option value="rdeca">Rdeča plošča (GKF / DF - Požarna)</option>
        </select>
    </div>
    <button onclick="klikRacunaj()">IZRAČUNAJ MATERIAL</button>
    
    <!-- 3. REZULTATI -->
    <div id="oknoRezultati" class="rezultati">
        <h3>📋 Potreben material:</h3>
        <table>
            <thead><tr><th>Material</th><th>Količina</th></tr></thead>
            <tbody id="izpisTabela"></tbody>
        </table>
    </div>
</div>

<script>
function klikPrijava() {
    var u = document.getElementById('user').value.trim().toLowerCase();
    var g = document.getElementById('pass').value.trim().toLowerCase();
    if (u === "test" && g === "test") {
        document.getElementById('oknoPrijava').style.display = 'none';
        document.getElementById('oknoKalkulator').style.display = 'block';
        document.getElementById('user').value = "";
        document.getElementById('pass').value = "";
        document.getElementById('napakica').style.display = 'none';
    } else {
        document.getElementById('napakica').style.display = 'block';
    }
}

function klikOdjava() {
    document.getElementById('oknoKalkulator').style.display = 'none';
    document.getElementById('oknoRezultati').style.display = 'none';
    document.getElementById('oknoPrijava').style.display = 'block';
}

function klikRacunaj() {
    var d = parseFloat(document.getElementById('dolz').value);
    var v = parseFloat(document.getElementById('vis').value);
    var g = document.getElementById('gradnja').value;
    var o = parseInt(document.getElementById('obloga').value);
    var t = document.getElementById('tip').value;
    
    if (!d || !v || d <= 0 || v <= 0) {
        alert("Vnesite pravilne mere.");
        return;
    }

    var m2 = d * v;
    var odp = 1.10;
    
    var pIme = "Mavčna plošča SIVA GKB (2x1.25m)";
    if (t === "zelena") pIme = "Mavčna plošča ZELENA GKBI (2x1.25m)";
    if (t === "rdeca") pIme = "Mavčna plošča RDEČA GKF/DF (Požarna)";

    var txt = "";

    if (g === "1" || g === "2" || g === "3") {
        var pr = "75"; var vol = "75mm";
        if (g === "1") { pr = "50"; vol = "50mm"; }
        if (g === "3") { pr = "100"; vol = "100mm"; }
        
        var p = Math.ceil((m2 * 2 * o * odp) / 2.5);
        var uw = Math.ceil((d * 2 * odp) / 4);
        var cw = Math.ceil(((d / 0.6) + 1) * odp);
        var vln = Math.ceil(m2 * odp);
        var vij = Math.ceil(m2 * 2 * o * 18);

        txt += "<tr><td>" + pIme + "</td><td><b>" + p + " kos</b></td></tr>";
        txt += "<tr><td>UW " + pr + " vodilo (4m)</td><td><b>" + uw + " kos</b></td></tr>";
        txt += "<tr><td>CW " + pr + " stebriček (3m)</td><td><b>" + cw + " kos</b></td></tr>";
        txt += "<tr><td>Izolacijska volna " + vol + "</td><td><b>" + vln + " m²</b></td></tr>";
        txt += "<tr><td>Vijaki TN 25 / TN 35</td><td><b>" + vij + " kos</b></td></tr>";
    } 
    else if (g === "4" || g === "5") {
        var p = Math.ceil((m2 * o * odp) / 2.5);
        var ud = Math.ceil((((d + v) * 2) * odp) / 3);
        var cd = Math.ceil(((v / 0.5) * d * odp) / 3);
        var vij = Math.ceil(m2 * o * 18);
        
        txt += "<tr><td>" + pIme + "</td><td><b>" + p + " kos</b></td></tr>";
        txt += "<tr><td>UD obodni profil (3m)</td><td><b>" + ud + " kos</b></td></tr>";
        txt += "<tr><td>CD nosilni profil (3m)</td><td><b>" + cd + " kos</b></td></tr>";
        
        if (g === "4") {
            txt += "<tr><td>Direktna obešala</td><td><b>" + Math.ceil(m2 * 2) + " kos</b></td></tr>";
        } else {
            txt += "<tr><td>Žica z ušesom</td><td><b>" + Math.ceil(m2 * 2) + " kos</b></td></tr>";
            txt += "<tr><td>Sidrno obešalo (Pentlja)</td><td><b>" + Math.ceil(m2 * 2) + " kos</b></td></tr>";
        }
        txt += "<tr><td>Vijaki TN 25 / TN 35</td><td><b>" + vij + " kos</b></td></tr>";
    } 
    else if (g === "6" || g === "7") {
        var p = Math.ceil((m2 * o * odp) / 2.5);
        var ud = Math.ceil((((d + v) * 2) * odp) / 3);
        var cd = Math.ceil(((v / 0.5) * d * odp) / 3);
        var vij = Math.ceil(m2 * o * 18);
        var fol = Math.ceil(m2 * 1.15);
        
        txt += "<tr><td>" + pIme + "</td><td><b>" + p + " kos</b></td></tr>";
        txt += "<tr><td>UD obodni profil (3m)</td><td><b>" + ud + " kos</b></td></tr>";
        txt += "<tr><td>CD nosilni profil (3m)</td><td><b>" + cd + " kos</b></td></tr>";
        
        if (g === "6") {
            txt += "<tr><td>Direktna obešala za les</td><td><b>" + Math.ceil(m2 * 2) + " kos</b></td></tr>";
        } else {
            txt += "<tr><td>Sidrni obešalnik (Šponar)</td><td><b>" + Math.ceil(m2 * 2) + " kos</b></td></tr>";
        }
        txt += "<tr><td>Parna zapora (Folija)</td><td><b>" + fol + " m²</b></td></tr>";
        txt += "<tr><td>Vijaki TN 25 / TN 35</td><td><b>" + vij + " kos</b></td></tr>";
    }

    document.getElementById('izpisTabela').innerHTML = txt;
    document.getElementById('oknoRezultati').style.display = 'block';
}
</script>

</body>
</html>
